services:
  postgres:
    image: postgres:16
    container_name: fintech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.3.1
    container_name: fintech_airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # `airflow standalone` запускает scheduler + webserver + triggerer +
      # dag-processor в одном процессе - подходящий объём Airflow для
      # DAG'а, запускаемого вручную для MVP, а не полный многоконтейнерный
      # CeleryExecutor-стек из quick-start документации Airflow.
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # Собственные метаданные Airflow живут в ОТДЕЛЬНОЙ БАЗЕ (не схеме)
      # внутри того же инстанса Postgres, что и склад данных - держит
      # служебную бухгалтерию оркестратора отдельно от схем
      # raw/staging/core/mart. См. postgres/init/03_airflow_db.sql.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      
      # Те же credentials, что используют загрузчики/dbt с хоста, но
      # POSTGRES_HOST переопределён на имя сервиса Docker Compose
      # "postgres" - изнутри этого контейнера "localhost" означал бы сам
      # контейнер, а не сервис postgres (поэтому loaders/db.py и
      # dbt/profiles.yml оба по умолчанию используют "localhost", но
      # сначала читают именно эту переменную окружения).ES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DBT_PROFILES_DIR: /opt/project/dbt
      _PIP_ADDITIONAL_REQUIREMENTS: "faker python-dotenv psycopg2-binary dbt-core dbt-postgres"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/project
    command: standalone

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: fintech_superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Задокументированная точка расширения Superset: любой .py файл
      # здесь автоматически импортируется при старте. Именно так
      # настраиваются SECRET_KEY и SQLALCHEMY_DATABASE_URI (СОБСТВЕННАЯ
      # база метаданных Superset - отдельная база "superset", см.
      # postgres/init/04_superset_db.sql), без зашивания секретов в сам образ.
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - superset_home:/app/superset_home
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.local --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088
      "

volumes:
  postgres_data:
    name: fintech_postgres_data
  superset_home:
    name: fintech_superset_home
