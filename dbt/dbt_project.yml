name: "fintech"
version: "1.0.0"
config-version: 2

profile: "fintech"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fintech:
    staging:
      # Views: staging делает лёгкую трансформацию (каст типов,
      # нормализация) поверх RAW. Материализация как view держит это
      # дёшево и всегда актуально относительно RAW - нет смысла хранить
      # ещё одну физическую копию почти таких же данных
      +materialized: view
      +schema: staging
    core:
      # Tables: core - стабильный слой, к которому обращаются напрямую
      # (измерения + факты). Материализация как table избавляет от
      # пересчёта join'ов/дедупликации на каждый запрос ниже по пайплайну
      +materialized: table
      +schema: core
    marts:
      # # Tables: marts - агрегированные данные, которые напрямую читает
      # Superset - они должны быстро открываться, а не пересчитываться
      # при каждой загрузке дашборда
      +materialized: table
      +schema: mart
