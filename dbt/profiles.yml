# Безопасно коммитить: здесь нет ни одного настоящего пароля, только
# ссылки на env_var(). Реальные значения приходят из .env файла проекта
# (того же самого, что используют docker-compose и Python-загрузчики) -
# dbt сам .env не читает, поэтому переменные должны быть подгружены в
# shell-окружение до запуска dbt-команд 

fintech:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
