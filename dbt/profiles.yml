# Safe to commit: no literal credentials here, only env_var() references.
# Actual values come from the project's .env file (same one docker-compose
# and the Python loaders use) - dbt does not read .env files itself, so it
# must be sourced into the shell environment before running dbt commands
# (see README / setup instructions).

fintech:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: public
      threads: 4
