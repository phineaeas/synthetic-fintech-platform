version: 2
 
models:
  - name: stg_customers
    description: >
      Одна строка на клиента, дедуплицировано и приведено к типам из
      raw.customers. Строки с NULL customer_id в RAW отфильтровываются
    columns:
      - name: customer_id
        description: Бизнес-ключ, формат CUST#####.
        tests:
          - unique
          - not_null
      - name: status
        description: Приведено к нижнему регистру.
        tests:
          - accepted_values:
              arguments:
                values: ["active", "inactive", "closed"]
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ["retail", "premium", "business"]
 
  - name: stg_accounts
    description: >
      Одна строка на счёт, дедуплицировано и приведено к типам из
      raw.accounts. Строки с NULL account_id, NULL customer_id, или
      customer_id, которого нет в stg_customers, отфильтровываются здесь.
    columns:
      - name: account_id
        description: Бизнес-ключ, формат ACC######.
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: currency
        description: Приведено к верхнему регистру.
        tests:
          - accepted_values:
              arguments:
                values: ["EUR", "USD", "GBP", "PLN"]
      - name: status
        description: Приведено к нижнему регистру.
        tests:
          - accepted_values:
              arguments:
                values: ["active", "closed", "suspended"]
      - name: account_type
        tests:
          - accepted_values:
              arguments:
                values: ["checking", "savings", "credit"]
 
  - name: stg_merchants
    description: >
      Одна строка на мерчанта, дедуплицировано и приведено к типам из
      raw.merchants. Строки с NULL merchant_id отфильтровываются здесь.
      Внешних ключей нет - мерчанты независимая сущность.
    columns:
      - name: merchant_id
        description: Бизнес-ключ, формат MERCH#####.
        tests:
          - unique
          - not_null
      - name: category
        description: Приведено к нижнему регистру.
        tests:
          - accepted_values:
              arguments:
                values:
                  - grocery
                  - electronics
                  - restaurant
                  - fashion
                  - entertainment
                  - travel
                  - utilities
 
  - name: stg_transactions
    description: >
      Одна строка на транзакцию, дедуплицировано и приведено к типам из
      raw.transactions. Строки с NULL transaction_id, или с account_id /
      merchant_id, которого нет в stg_accounts / stg_merchants,
      отфильтровываются здесь. Отрицательные суммы НЕ отфильтровываются -
      почему, см. SQL модели.
    columns:
      - name: transaction_id
        description: Бизнес-ключ, формат TXN#######.
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: merchant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id
      - name: currency
        description: Приведено к верхнему регистру.
        tests:
          - accepted_values:
              arguments:
                values: ["EUR", "USD", "GBP", "PLN"]
      - name: status
        description: Приведено к нижнему регистру.
        tests:
          - accepted_values:
              arguments:
                values: ["success", "failed", "pending"]
      - name: transaction_type
        tests:
          - accepted_values:
              arguments:
                values: ["purchase", "refund", "transfer", "withdrawal"]