version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Посадочная зона (raw), загружается Python-загрузчиками (full refresh:
      TRUNCATE + INSERT при каждом прогоне пайплайна). Без ограничений по
      дизайну - намеренно содержит NULL-ы, дубликаты, битые внешние ключи,
      разнобой регистра и неверные типы (точная механика искажений - в
      generators/, ~3% на каждый вид проблемы).
    tables:
      - name: customers
        description: Одна строка на сгенерированную запись клиента из условной CRM-системы.
      - name: accounts
        description: Одна строка на сгенерированную запись счёта из условной банковской системы.
      - name: merchants
        description: Одна строка на сгенерированную запись продавца из условной справочной системы.
      - name: transactions
        description: Одна строка на сгенерированную запись транзакции из условной банковской системы.
